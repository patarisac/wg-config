<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WireGuard Config Generator for Burp Suite Intercept</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./js/nacl-fast.min.js"></script>
  <script src="./js/qrcode.min.js"></script>
  <style>
    body {
      font-family: monospace;
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      background: #111;
      color: #0f0;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 8px 12px;
      margin-bottom: 15px;
      align-items: center;
    }
    label {
      text-align: right;
    }
    input, button {
      padding: 5px;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
    }
    button {
      grid-column: span 2;
      cursor: pointer;
    }
    .block {
      border: 1px solid #0f0;
      padding: 15px;
      margin: 15px 0;
      background: #000;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
    }
    canvas {
      margin-top: 10px;
    }
    h1, h2, h3 {
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>WireGuard Config Generator for Burp Suite Intercept</h1>
  <div class="form-grid">
    <label for="serverEndpoint">Server Endpoint:</label>
    <input id="serverEndpoint" value="192.168.0.10">

    <label for="Listen Port">Listen Port:</label>
    <input id="listenPort" type="number" value="51820">

    <label for="allowedIPs">AllowedIPs (client side):</label>
    <input id="allowedIPs" value="0.0.0.0/0">

    <label for="baseAddr">Server Subnet Base (/24):</label>
    <input id="baseAddr" value="10.13.37.">

    <label for="dns">DNS (for clients):</label>
    <input id="dns" value="1.1.1.1">

    <label for="wanIface">WAN Interface (for NAT):</label>
    <input id="wanIface" value="wlan0">

    <label for="Burp Suite Port">Burp Suite Port:</label>
    <input id="burpPort" type="number" value="8083">

    <label for="clientCount">Number of Clients:</label>
    <input id="clientCount" type="number" value="1">

    <button onclick="generateAll()">Generate</button>
  </div>

  <div id="output"></div>

  <script>
    function base64encode(bytes) {
      return btoa(String.fromCharCode.apply(null, bytes))
    }

    function safeQRCode(elementId, text) {
      const el = document.getElementById(elementId);
      if (!el) return;
      try {
        QRCode.toCanvas(text, { width: 256 }, function (err, canvas) {
          if (!err) {
            el.innerHTML = "";
            el.appendChild(canvas);
          }
        });
      } catch (e) {
        console.error("QR generation exception for", elementId, e);
      }
    }

    function generateAll() {
      const endpoint = document.getElementById("serverEndpoint").value.trim();
      const listenPort = document.getElementById("listenPort").value.trim();
      const allowed = document.getElementById("allowedIPs").value.trim();
      const dns = document.getElementById("dns").value.trim();
      const baseAddr = document.getElementById("baseAddr").value.trim();
      const wanIface = document.getElementById("wanIface").value.trim();
      const burpPort= document.getElementById("burpPort").value.trim();
      const count = parseInt(document.getElementById("clientCount").value);

      const out = document.getElementById("output");
      out.innerHTML = "";

      let serverKP = nacl.box.keyPair();
      let serverPriv = base64encode(serverKP.secretKey);
      let serverPub  = base64encode(serverKP.publicKey);

      let peerEntries = "";
      let clients = [];

      for (let i = 1; i <= count; i++) {
        let kp = nacl.box.keyPair();
        let priv = base64encode(kp.secretKey);
        let pub = base64encode(kp.publicKey);

        let addr = baseAddr + (i+1) + "/32";

        let clientConf = `[Interface]
PrivateKey = ${priv}
Address = ${addr}
DNS = ${dns}

[Peer]
PublicKey = ${serverPub}
AllowedIPs = ${allowed}
Endpoint = ${endpoint}:${listenPort}
PersistentKeepalive = 25`;

        clients.push({ id: i, pub, conf: clientConf });

        peerEntries += `

[Peer]
PublicKey = ${pub}
AllowedIPs = ${addr}`;
      }

      let serverConf = `[Interface]
PrivateKey = ${serverPriv}
Address = ${baseAddr}1/24
ListenPort = ${listenPort}
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = iptables -t nat -A POSTROUTING -s ${baseAddr}0/24 -o ${wanIface} -j MASQUERADE
PostUp = iptables -t nat -A PREROUTING -i %i -p tcp -j REDIRECT --to-port ${burpPort}
PostUp = iptables -I FORWARD -i %i -j ACCEPT
PostUp = iptables -I FORWARD -o %i -j ACCEPT
PostUp = iptables -t nat -A PREROUTING -i %i -p udp --dport 53 -j DNAT --to-destination ${dns}
PostUp = iptables -t nat -A PREROUTING -i %i -p tcp --dport 53 -j DNAT --to-destination ${dns}
PostDown = iptables -t nat -D POSTROUTING -s ${baseAddr}0/24 -o ${wanIface} -j MASQUERADE
PostDown = iptables -t nat -D PREROUTING -i %i -p tcp -j REDIRECT --to-port ${burpPort}
PostDown = iptables -D FORWARD -i %i -j ACCEPT
PostDown = iptables -D FORWARD -o %i -j ACCEPT
PostDown = iptables -t nat -D PREROUTING -i %i -p udp --dport 53 -j DNAT --to-destination ${dns}
PostDown = iptables -t nat -D PREROUTING -i %i -p tcp --dport 53 -j DNAT --to-destination ${dns}
PostDown = sysctl -w net.ipv4.ip_forward=0
${peerEntries}`;

      let serverDiv = document.createElement("div");
      serverDiv.className = "block";
      serverDiv.innerHTML = `<h2>Server (Host with Burp Suite)</h2>
        <p><b>PublicKey:</b> ${serverPub}</p>
        <textarea readonly>${serverConf}</textarea>
        <div id="qrServer"></div>`;
      out.appendChild(serverDiv);

      safeQRCode("qrServer", serverConf);

      clients.forEach(c => {
        let div = document.createElement("div");
        div.className = "block";
        div.innerHTML = `<h3>Client ${c.id}</h3>
          <p><b>PublicKey:</b> ${c.pub}</p>
          <textarea readonly>${c.conf}</textarea>
          <div id="qr${c.id}"></div>`;
        out.appendChild(div);

        safeQRCode("qr"+c.id, c.conf);
      });
    }
  </script>
</body>
</html>
